# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
  - build_dependency
  - test
  - release
  - build_docker_image

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  # - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.latest.gitlab-ci.yml
  - component: $CI_SERVER_FQDN/uniprot/aa/ci-components/library-release@master
    inputs:
      image: maven:3.9.16-amazoncorretto-17-debian
      production_branches: "master"
      maven_cli_opts: "-P jenkins"

variables:
  IMAGE_TAG_FILE: "${CI_PROJECT_DIR}/docker/versions.properties"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ''
  GITLAB_ADVANCED_SAST_ENABLED: 'true'
  DS_ENFORCE_NEW_ANALYZER: 'true'
  DS_MAX_DEPTH: "-1"
  GIT_DEPTH: "0"
  SECRET_DETECTION_HISTORIC_SCAN: "true"
  NEXTFLOW_DOCKERFILE: "docker/nextflow.Dockerfile"
  NEXTFLOW_IMAGE_NAME: "${CI_REGISTRY_IMAGE}/nextflow"


.mvn:
  image: maven:3.8.2-openjdk-17-slim
  before_script:
    - java --version
    - mvn --version

build:
  extends: .mvn
  # Running in the build stage ensures that the dependency-scanning job
  # receives the maven.graph.json artifacts.
  stage: build_dependency
  script:
    - mvn install
    - mvn org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputType=json -DoutputFile=maven.graph.json
  # Collect all maven.graph.json artifacts and pass them onto jobs
  # in sequential stages.
  artifacts:
    paths:
      - "**/*.jar"
      - "**/maven.graph.json"
  rules: &trigger_rules
    # Run on MR events: opened, new commits pushed to the source branch, reopened, etc.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Prevent duplicate branch pipelines when an MR already exists for the branch
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # Allow branch pipelines only when no open MR exists
    - if: '$CI_COMMIT_BRANCH'

test:
  extends: .mvn
  stage: test
  script:
    - mvn clean verify
  rules: *trigger_rules

python-test:
  stage: test
  image: ubuntu:24.04
  before_script:
    - apt-get update && apt-get install -y python3-pip python3 python3-lxml
    - python3 --version
    # flag is required to force system-wide installation (not in virtualenv)
    - pip install https://github.com/etetoolkit/ete/archive/ete4.zip --break-system-packages
  script:
    - cd ${CI_PROJECT_DIR}/misc/taxonomy
    - python3 -m unittest discover -s tests
  rules: *trigger_rules

nextflow-version-check:
  stage: test
  image: alpine:3.20
  script:
    - sh misc/release/check-nextflow-version.sh --config nextflow/defaults.nf
  rules: *trigger_rules

nextflow-tests:
  stage: test
  image: eclipse-temurin:17-jre-alpine
  before_script:
    - apk add --no-cache bash curl python3 libc6-compat
    # The nextflow installer writes a 'nextflow' launcher file into the
    # current directory, which collides with the project's nextflow/ directory.
    - mkdir -p /opt/nxf && (cd /opt/nxf && curl -fsSL https://get.nextflow.io | bash)
    - mv /opt/nxf/nextflow /usr/local/bin/
    - nextflow -version
    - python3 --version
  script:
    # Autodiscovers all test*.py under nextflow/tests: the stubbed pipeline
    # smoke tests (test_smoke.py) and the versions.json sanity checks
    # (test_versions.py).
    - python3 -m unittest discover -s ${CI_PROJECT_DIR}/nextflow/tests -v
  rules: *trigger_rules

.docker_image:
  image: docker:24.0.5
  tags:
    - dind
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "Building UniFire docker image"
    - docker --version
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - export UNIFIRE_IMAGE_TAG=$(grep -E "^UNIFIRE_DOCKER_IMAGE_VERSION=" "${IMAGE_TAG_FILE}" | cut -d '=' -f 2)
    - echo "UniFire image tag will be = ${UNIFIRE_IMAGE_TAG}"

build_push_nextflow_docker_image:
  stage: build_docker_image
  image: docker:24.0.5-git
  tags:
    - dind
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "Building UniFIRE Nextflow docker image"
    - docker --version
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - export NEXTFLOW_IMAGE_TAG=$(sh misc/release/check-nextflow-version.sh --tag "${CI_COMMIT_REF_NAME}" --print)
    - echo "UniFIRE Nextflow image tag will be = ${NEXTFLOW_IMAGE_TAG}"
    - echo "Checking nextflow engine.unifireVersion matches tag or branch ${CI_COMMIT_REF_NAME}"
    - sh misc/release/check-nextflow-version.sh --tag "${CI_COMMIT_REF_NAME}"
  script:
    - IMAGE_NAME=${NEXTFLOW_IMAGE_NAME}:${NEXTFLOW_IMAGE_TAG}
    - echo "Building image ${IMAGE_NAME}"
    - docker build --file ${NEXTFLOW_DOCKERFILE} --tag ${IMAGE_NAME} --no-cache .
    - docker image ls
    - docker push ${IMAGE_NAME}
    # Track the latest release with a moving "latest" tag
    - docker tag ${IMAGE_NAME} ${NEXTFLOW_IMAGE_NAME}:latest
    - docker push ${NEXTFLOW_IMAGE_NAME}:latest
    - docker rmi ${IMAGE_NAME} ${NEXTFLOW_IMAGE_NAME}:latest
    - docker logout "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH =~ /^release\//

build_push_snapshot_nextflow_docker_image:
  stage: build_docker_image
  image: docker:24.0.5-git
  tags:
    - dind
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "Building UniFIRE Nextflow snapshot docker image"
    - docker --version
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - export NEXTFLOW_IMAGE_TAG=$(sh misc/release/check-nextflow-version.sh --tag "${CI_COMMIT_REF_NAME}" --print)
    - echo "UniFIRE Nextflow snapshot image tag will be = ${NEXTFLOW_IMAGE_TAG}"
    - echo "Checking nextflow engine.unifireVersion matches branch ${CI_COMMIT_REF_NAME}"
    - sh misc/release/check-nextflow-version.sh --tag "${CI_COMMIT_REF_NAME}"
  script:
    - IMAGE_NAME=${NEXTFLOW_IMAGE_NAME}:${NEXTFLOW_IMAGE_TAG}
    - echo "Building image ${IMAGE_NAME}"
    - docker build --file ${NEXTFLOW_DOCKERFILE} --tag ${IMAGE_NAME} --no-cache .
    - docker image ls
    - docker push ${IMAGE_NAME}
    - docker rmi ${IMAGE_NAME}
    - docker logout "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^snapshot\//
