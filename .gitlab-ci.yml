stages:
  - test
  - build_docker_image

variables:
  IMAGE_TAG_FILE: ${CI_PROJECT_DIR}/docker/versions.properties
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

.mvn:
  image: maven:3.8.2-openjdk-17-slim
  before_script:
    - java --version
    - mvn --version

test:
  extends: .mvn
  stage: test
  script:
    - mvn clean verify

python-test:
  stage: test
  image: ubuntu:24.04
  before_script:
    - apt-get update && apt-get install -y python3-pip python3 python3-lxml
    - python3 --version
    # flag is required to force system-wide installation (not in virtualenv)
    - pip install https://github.com/etetoolkit/ete/archive/ete4.zip --break-system-packages
  script:
    - cd ${CI_PROJECT_DIR}/misc/taxonomy
    - python3 -m unittest discover -s tests


.docker_image:
  image: docker:24.0.5
  tags:
    - dind
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "Building UniFire docker image"
    - docker --version
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - export UNIFIRE_IMAGE_TAG=$(grep -E "^UNIFIRE_DOCKER_IMAGE_VERSION=" "${IMAGE_TAG_FILE}" | cut -d '=' -f 2)
    - echo "UniFire image tag will be = ${UNIFIRE_IMAGE_TAG}"

.build_docker_image_template:
  stage: build_docker_image
  extends: .docker_image
  script:
    - CONTAINER_IMAGE=${CI_REGISTRY_IMAGE}:${UNIFIRE_IMAGE_TAG}
    - export IMAGE_NAME=${CONTAINER_IMAGE}${IMAGE_SUFFIX}
    - echo "Building image ${IMAGE_NAME}"
    - docker build --target ${DOCKER_TARGET} --tag ${IMAGE_NAME} --no-cache docker
    - docker image ls
    - docker push ${IMAGE_NAME}
    - docker rmi ${IMAGE_NAME}
    - docker logout "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == "pre_release" && $CI_COMMIT_TITLE =~ /^Merge branch '.*' into 'pre_release'$/
      when: on_success

build_docker_image_lite:
  extends: .build_docker_image_template
  variables:
    DOCKER_TARGET: lite
    IMAGE_SUFFIX: -lite

build_docker_image_full:
  extends: .build_docker_image_template
  variables:
    DOCKER_TARGET: full
    IMAGE_SUFFIX: ""
